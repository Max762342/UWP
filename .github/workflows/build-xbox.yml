name: Build XB-Launcher UWP (Xbox)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-uwp:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Create Certificate
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path output | Out-Null
        $certPwd = ConvertTo-SecureString -String "xblauncher" -Force -AsPlainText
        $cert = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=XB-Launcher" `
          -KeyUsage DigitalSignature `
          -KeyAlgorithm RSA `
          -KeyLength 2048 `
          -KeySpec Signature `
          -KeyExportPolicy Exportable `
          -FriendlyName "XB-Launcher Dev Cert" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @("2.5.29.19={text}ca=false", "2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.14={hex}00")
        Export-PfxCertificate -Cert $cert -FilePath output/XB-Launcher.pfx -Password $certPwd | Out-Null
        $thumb = $cert.Thumbprint
        "thumb=$thumb" >> $env:GITHUB_OUTPUT
        Write-Host "Cert thumbprint: $thumb"
      id: cert

    - name: Restore + Build + Package UWP (Release x64, signed)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Continue"
        New-Item -ItemType Directory -Force -Path output | Out-Null
        Write-Host "MSBuild: $((Get-Command msbuild).Source)"
        # Absolute path: MSBuild resolves PackageCertificateKeyFile relative to the
        # project dir, so a repo-root-relative path would not be found.
        $pfx = (Resolve-Path output/XB-Launcher.pfx).Path
        Write-Host "PFX: $pfx"
        # MSBuild performs the .NET Native compile AND signs the appx itself,
        # which avoids the standalone-signtool 0x8007000b appx-format error.
        msbuild src/XBLauncher.UwpApp/XBLauncher.UwpApp.csproj `
          /t:Restore,Build `
          /p:Configuration=Release /p:Platform=x64 `
          /p:AppxBundle=Never `
          /p:UapAppxPackageBuildMode=SideloadOnly `
          /p:AppxPackageSigningEnabled=true `
          /p:PackageCertificateKeyFile=$pfx `
          /p:PackageCertificatePassword=xblauncher `
          /p:AppxPackageSigningTimestampDigestAlgorithm=SHA256 `
          /restore /m /v:m /bl:output/uwp.binlog 2>&1 | Tee-Object -FilePath output/uwp-build.log
        $code = $LASTEXITCODE
        $tail = Get-Content output/uwp-build.log -Tail 200 -ErrorAction SilentlyContinue
        $fence = [string]::new([char]96, 3)
        $sb = New-Object System.Text.StringBuilder
        [void]$sb.AppendLine('## UWP build log (tail)')
        [void]$sb.AppendLine($fence)
        foreach ($line in $tail) { [void]$sb.AppendLine($line) }
        [void]$sb.AppendLine($fence)
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $sb.ToString()
        if ($code -ne 0) { throw "UWP build failed (exit $code). See summary for the error tail." }

    - name: Upload build logs (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: uwp-build-logs
        path: |
          output/uwp-build.log
          output/uwp.binlog
        retention-days: 5

    - name: Locate makeappx / signtool
      id: sdk
      shell: pwsh
      run: |
        $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
        $makeappx = Get-ChildItem $kits -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
        $signtool  = Get-ChildItem $kits -Recurse -Filter signtool.exe  -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $makeappx) { throw "makeappx.exe not found" }
        "makeappx=$($makeappx.FullName)" >> $env:GITHUB_OUTPUT
        "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

    - name: Locate built app package
      id: find
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path output | Out-Null
        # The app package is produced as .msix under AppPackages\..._Test\.
        # Prefer it; only fall back to .appx. Never pick a framework package.
        $pkg = Get-ChildItem "src/XBLauncher.UwpApp/AppPackages" -Recurse -Include *.msix,*.appx -ErrorAction SilentlyContinue |
               Where-Object { $_.Name -like 'XBLauncher.UwpApp_*' } |
               Sort-Object Length -Descending |
               Select-Object -First 1
        if (-not $pkg) {
          $pkg = Get-ChildItem "src/XBLauncher.UwpApp" -Recurse -Include *.msix,*.appx -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -like 'XBLauncher.UwpApp_*' } |
                 Sort-Object Length -Descending |
                 Select-Object -First 1
        }
        if (-not $pkg) { throw "No app package (XBLauncher.UwpApp_*.msix/.appx) produced by the UWP build." }
        Write-Host "Found app package: $($pkg.FullName) ($([math]::Round($pkg.Length/1MB,1)) MB)"
        Copy-Item $pkg.FullName "output/XB-Launcher-UWP.appx" -Force
        "appx=output/XB-Launcher-UWP.appx" >> $env:GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XB-Launcher-UWP-Xbox
        path: |
          output/XB-Launcher-UWP.appx
          output/XB-Launcher.pfx
        retention-days: 90