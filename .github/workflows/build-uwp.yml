name: Build XB-Launcher UWP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: |
        dotnet restore src/XBLauncher.Core/XBLauncher.Core.csproj
        dotnet restore src/XBLauncher.App/XBLauncher.App.csproj
        dotnet restore src/XBLauncher.Uwp/XBLauncher.Uwp.csproj
    
    - name: Build Core (platform-independent)
      run: dotnet build src/XBLauncher.Core/XBLauncher.Core.csproj -c Release
    
    - name: Publish UWP App
      run: |
        dotnet publish src/XBLauncher.Uwp/XBLauncher.Uwp.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -o output/publish `
          -p:PublishSingleFile=false
    
    - name: Generate Store Assets
      shell: pwsh
      run: |
        $stage = "output/appx"
        $assetsDir = "$stage/Assets"
        New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null
        
        Add-Type -AssemblyName System.Drawing
        
        function New-Tile($path, $w, $h, $text) {
          $bmp = New-Object System.Drawing.Bitmap $w, $h
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(255, 14, 17, 22))
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 61, 220, 132))
          $font = New-Object System.Drawing.Font "Segoe UI", ([math]::Max(8, [int]($w/6))), ([System.Drawing.FontStyle]::Bold)
          $size = $g.MeasureString($text, $font)
          $g.DrawString($text, $font, $brush, (($w - $size.Width)/2), (($h - $size.Height)/2))
          $g.Dispose()
          $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
        }
        
        New-Tile "$assetsDir/StoreLogo.png" 50 50 "XB"
        New-Tile "$assetsDir/Square44x44Logo.png" 44 44 "XB"
        New-Tile "$assetsDir/Square150x150Logo.png" 150 150 "XB-Launcher"
        New-Tile "$assetsDir/Wide310x150Logo.png" 310 150 "XB-Launcher"
        New-Tile "$assetsDir/SplashScreen.png" 620 300 "XB-Launcher"
    
    - name: Prepare Appx Payload
      shell: pwsh
      run: |
        Copy-Item packaging/AppxManifest.xml output/appx/AppxManifest.xml -Force
        Copy-Item output/publish/* output/appx/ -Recurse -Force
        if (Test-Path native/xb_shim/xb_shim.dll) {
          Copy-Item native/xb_shim/xb_shim.dll output/appx/xb_shim.dll -Force
        }
    
    - name: Create APPX Package
      shell: pwsh
      run: |
        $sdkTools = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64"
        if (!(Test-Path "$sdkTools\makeappx.exe")) {
          Write-Host "Installing Windows SDK..."
          # Install Windows SDK here
        }
        & "$sdkTools\makeappx.exe" pack /d output/appx /p output/XB-Launcher.appx /o
    
    - name: Create Signing Certificate
      shell: pwsh
      run: |
        $certPath = "output/XB-Launcher.pfx"
        $certPwd = ConvertTo-SecureString -String "xblauncher" -Force -AsPlainText
        
        if (!(Test-Path $certPath)) {
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=XB-Launcher" `
            -KeyUsage DigitalSignature `
            -FriendlyName "XB-Launcher Dev Cert" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          
          Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $certPwd | Out-Null
        }
    
    - name: Sign APPX Package
      shell: pwsh
      run: |
        $sdkTools = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64"
        & "$sdkTools\signtool.exe" sign /f output/XB-Launcher.pfx /p "xblauncher" /fd SHA256 output/XB-Launcher.appx
    
    - name: Upload APPX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XB-Launcher-Package
        path: |
          output/XB-Launcher.appx
          output/XB-Launcher.pfx
        retention-days: 30